name: CD Pipeline
on:
  push:
    branches: [main]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push auth-service
        run: |
          docker build -t anshdixit14/taskflow-auth:${{ github.sha }} -t anshdixit14/taskflow-auth:latest ./auth-service
          docker push anshdixit14/taskflow-auth:${{ github.sha }}
          docker push anshdixit14/taskflow-auth:latest
      - name: Build and push api-gateway
        run: |
          docker build -t anshdixit14/taskflow-gateway:${{ github.sha }} -t anshdixit14/taskflow-gateway:latest ./api-gateway
          docker push anshdixit14/taskflow-gateway:${{ github.sha }}
          docker push anshdixit14/taskflow-gateway:latest
      - name: Build and push notification-service
        run: |
          docker build -t anshdixit14/taskflow-notification:${{ github.sha }} -t anshdixit14/taskflow-notification:latest ./notification-service
          docker push anshdixit14/taskflow-notification:${{ github.sha }}
          docker push anshdixit14/taskflow-notification:latest
      - name: Build and push analytics-service
        run: |
          docker build -t anshdixit14/taskflow-analytics:${{ github.sha }} -t anshdixit14/taskflow-analytics:latest ./analytics-service
          docker push anshdixit14/taskflow-analytics:${{ github.sha }}
          docker push anshdixit14/taskflow-analytics:latest
