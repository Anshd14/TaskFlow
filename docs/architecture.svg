<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="620" fill="#fafafa"/>

  <!-- API Gateway -->
  <rect x="380" y="30" width="240" height="70" rx="10" fill="#18181b"/>
  <text x="500" y="58" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">API Gateway</text>
  <text x="500" y="78" text-anchor="middle" fill="#a1a1aa" font-size="12">Spring Cloud Gateway · :9000</text>

  <!-- lines from gateway to services -->
  <line x1="500" y1="100" x2="160" y2="180" stroke="#d4d4d8" stroke-width="2"/>
  <line x1="500" y1="100" x2="500" y2="180" stroke="#d4d4d8" stroke-width="2"/>
  <line x1="500" y1="100" x2="840" y2="180" stroke="#d4d4d8" stroke-width="2"/>

  <!-- Auth Service -->
  <rect x="40" y="180" width="240" height="110" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="160" y="208" text-anchor="middle" fill="#18181b" font-size="14" font-weight="600">Auth Service</text>
  <text x="160" y="226" text-anchor="middle" fill="#71717a" font-size="11">Spring Boot · :8080</text>
  <text x="160" y="248" text-anchor="middle" fill="#52525b" font-size="11">Auth · Workspaces</text>
  <text x="160" y="264" text-anchor="middle" fill="#52525b" font-size="11">Projects · Tasks · AI</text>
  <text x="160" y="280" text-anchor="middle" fill="#52525b" font-size="11">S3 Attachments</text>

  <!-- Notification Service -->
  <rect x="380" y="180" width="240" height="110" rx="10" fill="#ffffff" stroke="#a1a1aa" stroke-width="2"/>
  <text x="500" y="208" text-anchor="middle" fill="#18181b" font-size="14" font-weight="600">Notification Service</text>
  <text x="500" y="226" text-anchor="middle" fill="#71717a" font-size="11">Spring Boot · :8081</text>
  <text x="500" y="252" text-anchor="middle" fill="#52525b" font-size="11">Consumes task events</text>
  <text x="500" y="268" text-anchor="middle" fill="#52525b" font-size="11">from Kafka</text>

  <!-- Analytics Service -->
  <rect x="720" y="180" width="240" height="110" rx="10" fill="#ffffff" stroke="#a1a1aa" stroke-width="2"/>
  <text x="840" y="208" text-anchor="middle" fill="#18181b" font-size="14" font-weight="600">Analytics Service</text>
  <text x="840" y="226" text-anchor="middle" fill="#71717a" font-size="11">FastAPI · :8001</text>
  <text x="840" y="252" text-anchor="middle" fill="#52525b" font-size="11">Task summaries by</text>
  <text x="840" y="268" text-anchor="middle" fill="#52525b" font-size="11">project / user</text>

  <!-- lines down to infra -->
  <line x1="160" y1="290" x2="160" y2="430" stroke="#d4d4d8" stroke-width="2"/>
  <line x1="160" y1="290" x2="500" y2="430" stroke="#d4d4d8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="840" y1="290" x2="160" y2="430" stroke="#d4d4d8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="500" y1="290" x2="660" y2="430" stroke="#d4d4d8" stroke-width="2"/>
  <line x1="160" y1="290" x2="330" y2="430" stroke="#d4d4d8" stroke-width="2"/>

  <!-- MySQL -->
  <rect x="60" y="430" width="200" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="160" y="460" text-anchor="middle" fill="#18181b" font-size="14" font-weight="600">MySQL</text>
  <text x="160" y="478" text-anchor="middle" fill="#71717a" font-size="11">:3306</text>

  <!-- Redis -->
  <rect x="290" y="430" width="200" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="390" y="460" text-anchor="middle" fill="#18181b" font-size="14" font-weight="600">Redis</text>
  <text x="390" y="478" text-anchor="middle" fill="#71717a" font-size="11">:6379 · JWT blacklist</text>

  <!-- Kafka -->
  <rect x="560" y="430" width="200" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="660" y="460" text-anchor="middle" fill="#18181b" font-size="14" font-weight="600">Kafka</text>
  <text x="660" y="478" text-anchor="middle" fill="#71717a" font-size="11">:9092 · task events</text>

  <!-- S3 -->
  <rect x="790" y="430" width="170" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="875" y="460" text-anchor="middle" fill="#18181b" font-size="14" font-weight="600">AWS S3</text>
  <text x="875" y="478" text-anchor="middle" fill="#71717a" font-size="11">attachments</text>
  <line x1="160" y1="290" x2="875" y2="430" stroke="#d4d4d8" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Frontend -->
  <rect x="380" y="540" width="240" height="60" rx="10" fill="#6366f1"/>
  <text x="500" y="565" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">React Frontend</text>
  <text x="500" y="583" text-anchor="middle" fill="#e0e7ff" font-size="11">Vite · Tailwind · :5173</text>
  <line x1="500" y1="540" x2="500" y2="100" stroke="#6366f1" stroke-width="2"/>
</svg>
